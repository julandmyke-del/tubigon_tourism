name: tubigon_tourism
description: "Tour Tubigon — Connecting tourists, MSMEs, and the LGU of Tubigon, Bohol."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # HTTP & Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Local Storage
  sqflite: ^2.3.3+1
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # Maps
  maplibre_gl: ^0.26.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Media & Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1

  # UI & Animations
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  smooth_page_indicator: ^1.2.0+3
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.3

  # Charts & Analytics
  fl_chart: ^0.68.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  permission_handler: ^11.3.1
  logger: ^2.4.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

# 7.2.17 fails Android compilation with the current Flutter plugin toolchain
# because its generated ResultUtilsKt bridge is not available to javac.
dependency_overrides:
  google_sign_in_android: 7.2.16

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/
    - backend/resources/data/tubigon_boundary.geojson

  fonts: []
